<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoir - 我的相册集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #faf7f2;
    --bg-card: #ffffff;
    --text: #2d2420;
    --text-soft: #6b5d50;
    --text-muted: #9b8b7b;
    --accent: #8b2635;
    --accent-hover: #6d1e2a;
    --border: #e8e0d4;
    --shadow: rgba(45, 36, 32, 0.08);
    --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 4rem 2rem 3rem;
  }

  /* Header */
  .site-header {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .site-header h1 {
    font-family: var(--serif);
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 0.4rem;
  }

  .site-divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 1rem auto;
    border-radius: 1px;
  }

  .site-header .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* Album count badge */
  .album-count {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.9rem;
    background: var(--accent);
    color: white;
    border-radius: 100px;
    font-size: 0.8rem;
    font-weight: 500;
    margin-top: 1rem;
  }

  /* Grid */
  .album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.8rem;
  }

  /* Album card */
  .album-card {
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                border-color 0.25s ease;
  }

  .album-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px var(--shadow);
    border-color: var(--accent);
  }

  /* Cover image */
  .album-cover {
    position: relative;
    width: 100%;
    padding-top: 65%;
    background: linear-gradient(135deg, #f0ebe4, #e8e0d4);
    overflow: hidden;
  }

  .album-cover img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .album-card:hover .album-cover img {
    transform: scale(1.04);
  }

  .album-cover::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(transparent, rgba(0,0,0,0.12));
    pointer-events: none;
  }

  /* Placeholder when no cover image */
  .album-cover--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .album-cover--empty svg {
    width: 48px;
    height: 48px;
    color: var(--text-muted);
    opacity: 0.4;
  }

  /* Card body */
  .album-body {
    padding: 1.2rem 1.3rem 1.4rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .album-title {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  .album-intro {
    font-size: 0.85rem;
    color: var(--text-soft);
    line-height: 1.6;
    flex: 1;
  }

  .album-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.6rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
  }

  .album-footer span {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .album-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--text-muted);
    transition: background 0.2s, color 0.2s;
  }

  .album-card:hover .album-arrow {
    background: var(--accent);
    color: white;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
  }

  .empty-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px dashed var(--border);
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }

  .empty-state h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .empty-state p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* Footer */
  .site-footer {
    text-align: center;
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .site-footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .site-footer a:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .page { padding: 2.5rem 1.2rem 2rem; }
    .site-header h1 { font-size: 1.8rem; }
    .album-grid { grid-template-columns: 1fr; gap: 1.2rem; }
    .album-cover { padding-top: 56%; }
  }

  @media (min-width: 641px) and (max-width: 960px) {
    .album-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <h1>Memoir</h1>
    <div class="site-divider"></div>
    <p class="subtitle">我的照片故事集</p>
    <div class="album-count">1 本相册</div>
  </header>

  <div class="album-grid">
    <a class="album-card" href="albums/五月纪行-雨入北平/">
      <div class="album-cover">
        <img src="albums/五月纪行-雨入北平/images/img_1779976916237308000_8281536a.jpg" alt="五月纪行 · 雨入北平" loading="lazy">
      </div>
      <div class="album-body">
        <h2 class="album-title">五月纪行 · 雨入北平</h2>
        <p class="album-intro">雨洗过的北京。从红墙绿瓦的步道开始，一路走进水汽与倒影的旧梦里。</p>
        <div class="album-footer">
          <span>查看相册</span>
          <span class="album-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
        </div>
      </div>
    </a>
  </div>

  <footer class="site-footer">
    <p>由 <a href="https://github.com" target="_blank">Memoir</a> 生成 · 2026-05-31</p>
  </footer>
</div>
</body>
</html>
